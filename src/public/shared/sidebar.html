
<div class="sidebar">
  <!-- Toggle Button -->
  <button class="sidebar-toggle" id="sidebarToggle" title="Toggle menu">
    <i class="fa-solid fa-bars"></i>
    <span class="toggle-label">ICE ERP</span>
  </button>

  <!-- Profile Section -->
  <div class="sidebar-profile">
    <div class="sidebar-avatar-wrap">
      <img id="sidebarProfileImg" src="" class="sidebar-profile-img" alt="profile" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
      <i class="fa-solid fa-user sidebar-avatar-icon" style="display:none"></i>
    </div>
    <div class="sidebar-profile-info">
      <span id="sidebarUsername" class="sidebar-username"></span>
    </div>
  </div>

  <!-- Menu -->
  <ul class="sidebar-menu" id="sidebarMenu"></ul>
</div>
