<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quality Control | ICE ERP</title>
  <link rel="icon" type="image/x-icon" href="/img/favicon.ico" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="/shared/base.css" />
  <link rel="stylesheet" href="/shared/navbar.css" />
  <link rel="stylesheet" href="/shared/sidebar.css" />
  <link rel="stylesheet" href="qc.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/shared/swal.js"></script>
</head>
<body>
  <div id="navbar-placeholder"></div>
  <div id="sidebarContainer"></div>
  <div class="page-title-bar"><h1><i class="fa fa-microscope"></i> Quality Control</h1></div>
  <div class="page-content">
    <div class="toolbar">
      <button id="addBtn" class="btn-primary"><i class="fa fa-plus"></i> Add QC Record</button>
      <span class="spacer"></span>
      <input type="text" id="searchInput" placeholder="Search item..." />
      <select id="typeFilter">
        <option value="all">All Types</option>
        <option value="material">Material</option>
        <option value="product">Product</option>
      </select>
      <button id="searchBtn" class="btn-primary"><i class="fa fa-search"></i> Search</button>
    </div>
    <div class="table-card">
      <table>
        <thead><tr><th>QC No</th><th>Item</th><th>Type</th><th>Result</th><th>Date</th><th>Actions</th><th>Inspector</th></tr></thead>
        <tbody id="qcTable"><tr><td colspan="7" class="text-center">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
  <script src="/shared/auth.js"></script>
  <script src="/shared/sidebar.js"></script>
  <script src="/shared/layout.js"></script>
  <script src="qc.js"></script>
  <script>checkLogin();</script>
</body>
</html>
