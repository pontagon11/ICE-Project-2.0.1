<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add QC Record | ICE ERP</title>
  <link rel="icon" type="image/x-icon" href="/img/favicon.ico" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="/shared/base.css" />
  <link rel="stylesheet" href="/shared/navbar.css" />
  <link rel="stylesheet" href="/shared/sidebar.css" />
  <link rel="stylesheet" href="qc-add.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/shared/swal.js"></script>
</head>
<body>
  <div id="navbar-placeholder"></div>
  <div id="sidebarContainer"></div>
  <div class="page-title-bar"><h1><i class="fa fa-plus-circle"></i> Add QC Record</h1></div>
  <div class="page-content">
    <div class="form-card">
      <form id="qcForm">
        <div class="form-row">
          <div class="form-group">
            <label>Item Type</label>
            <select id="itemType">
              <option value="">Select Type</option>
              <option value="material">Material</option>
              <option value="product">Product</option>
            </select>
          </div>
          <div class="form-group"><label>Item</label><select id="itemSelect"><option value="">Select Item</option></select></div>
        </div>
        <div class="form-group"><label>Inspector</label><select id="empSelect"><option value="">Select Inspector</option></select></div>
        <div class="form-group"><label>Note</label><textarea id="qcNote" rows="3" placeholder="QC notes..."></textarea></div>
        <div class="form-actions">
          <button type="submit" class="btn-primary"><i class="fa fa-save"></i> Submit QC</button>
          <button type="button" id="cancelBtn" class="btn-secondary"><i class="fa fa-times"></i> Cancel</button>
        </div>
      </form>
    </div>
  </div>
  <script src="/shared/auth.js"></script>
  <script src="/shared/sidebar.js"></script>
  <script src="/shared/layout.js"></script>
  <script src="qc-add.js"></script>
  <script>checkLogin();</script>
</body>
</html>
