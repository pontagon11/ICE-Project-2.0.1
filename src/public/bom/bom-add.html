<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add BOM | ICE ERP</title>
  <link rel="icon" type="image/x-icon" href="/img/favicon.ico" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="/shared/base.css" />
  <link rel="stylesheet" href="/shared/navbar.css" />
  <link rel="stylesheet" href="/shared/sidebar.css" />
  <link rel="stylesheet" href="bom-add.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/shared/swal.js"></script>
</head>
<body>
  <div id="navbar-placeholder"></div>
  <div id="sidebarContainer"></div>
  <div class="page-title-bar"><h1><i class="fa fa-plus-circle"></i> Add BOM</h1></div>
  <div class="page-content">
    <div class="form-card">
      <div class="form-row">
        <div class="form-group"><label>BOM Number</label><input type="text" id="bomNo" placeholder="e.g. BOM-001" readonly /></div>
        <div class="form-group"><label>Product</label><select id="productSelect"><option value="">Select Product</option></select></div>
      </div>
      <hr style="margin:20px 0;border-color:var(--gray-200)" />
      <h3 style="font-size:15px;color:var(--gray-700);margin-bottom:14px"><i class="fa fa-layer-group"></i> Add Materials</h3>
      <div class="form-row" style="align-items:flex-end">
        <div class="form-group"><label>Material</label><select id="materialSelect"><option value="">Select Material</option></select></div>
        <div class="form-group"><label>Usage Qty</label><input type="number" id="usageQty" placeholder="0" min="0" step="0.01" /></div>
        <button type="button" id="addMaterialBtn" class="btn-primary" style="margin-bottom:16px"><i class="fa fa-plus"></i> Add</button>
      </div>
      <div class="table-card" style="margin-top:0">
        <table>
          <thead><tr><th>Material</th><th>Usage Qty</th><th>Remove</th></tr></thead>
          <tbody id="materialTableBody"><tr><td colspan="3" class="text-center" style="color:var(--gray-400)">No materials added yet</td></tr></tbody>
        </table>
      </div>
      <div class="form-actions">
        <button id="saveBomBtn" class="btn-primary"><i class="fa fa-save"></i> Save BOM</button>
        <button onclick="window.location.href='/bom/bom.html'" class="btn-secondary"><i class="fa fa-times"></i> Cancel</button>
      </div>
    </div>
  </div>
  <script src="/shared/auth.js"></script>
  <script src="/shared/sidebar.js"></script>
  <script src="/shared/layout.js"></script>
  <script src="bom-add.js"></script>
  <script>checkLogin();</script>
</body>
</html>
