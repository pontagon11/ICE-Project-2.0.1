<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transactions | ICE ERP</title>
  <link rel="icon" type="image/x-icon" href="/img/favicon.ico" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="/shared/base.css" />
  <link rel="stylesheet" href="/shared/navbar.css" />
  <link rel="stylesheet" href="/shared/sidebar.css" />
  <link rel="stylesheet" href="transactions.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/shared/swal.js"></script>
</head>
<body>
  <div id="navbar-placeholder"></div>
  <div id="sidebarContainer"></div>
  <div class="page-title-bar"><h1><i class="fa fa-right-left"></i> Transactions</h1></div>
  <div class="page-content">
    <div class="toolbar">
      <button id="addTransactionBtn" class="btn-primary"><i class="fa fa-plus"></i> Add Transaction</button>
      <span class="spacer"></span>
      <input type="text" id="searchInput" placeholder="Search item..." />
      <select id="typeFilter">
        <option value="">All Types</option>
        <option value="IN">IN</option>
        <option value="OUT">OUT</option>
      </select>
      <button id="searchBtn" class="btn-primary"><i class="fa fa-search"></i> Search</button>
    </div>
    <div class="table-card">
      <table>
        <thead><tr><th>Txn No</th><th>Item</th><th>Item Type</th><th>Txn Type</th><th>Qty</th><th>Date</th><th>Note</th><th>Actions</th></tr></thead>
        <tbody id="historyTable"><tr><td colspan="8" class="text-center">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
  <script src="/shared/auth.js"></script>
  <script src="/shared/sidebar.js"></script>
  <script src="/shared/layout.js"></script>
  <script src="transactions.js"></script>
  <script>checkLogin();</script>
</body>
</html>
