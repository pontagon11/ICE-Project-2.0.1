<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Employee | ICE ERP</title>
  <link rel="icon" type="image/x-icon" href="/img/favicon.ico" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="/shared/base.css" />
  <link rel="stylesheet" href="/shared/navbar.css" />
  <link rel="stylesheet" href="/shared/sidebar.css" />
  <link rel="stylesheet" href="employee-edit.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/shared/swal.js"></script>
</head>
<body>
  <div id="navbar-placeholder"></div>
  <div id="sidebarContainer"></div>
  <div class="page-title-bar"><h1><i class="fa fa-user-pen"></i> Edit Employee</h1></div>
  <div class="page-content">
    <div class="form-card">
      <div class="photo-section">
        <div class="preview-photo-wrap">
          <img id="previewImg" src="" alt="Preview" class="preview-photo" style="display:none" />
          <div id="previewPlaceholder" class="preview-photo-placeholder"><i class="fa-solid fa-user"></i></div>
        </div>
        <button type="button" id="chooseImageBtn" class="btn-secondary"><i class="fa fa-image"></i> Change Photo</button>
        <input type="file" id="emp_img" accept="image/*" style="display:none" />
      </div>
      <div class="form-row">
        <div class="form-group"><label>First Name</label><input type="text" id="emp_fname" placeholder="First name" /></div>
        <div class="form-group"><label>Last Name</label><input type="text" id="emp_lname" placeholder="Last name" /></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Email</label><input type="email" id="emp_email" placeholder="email@example.com" /></div>
        <div class="form-group"><label>Tel</label><input type="text" id="emp_tel" placeholder="Phone number" /></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Username</label><input type="text" id="emp_username" placeholder="Username" /></div>
        <div class="form-group">
          <label>New Password <small>(leave blank to keep)</small></label>
          <div class="input-pw-wrap">
            <input type="password" id="emp_password" placeholder="New password" />
            <button type="button" id="toggle-password" class="toggle-pw"><i class="fa fa-eye"></i></button>
          </div>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Department</label><select id="dept_id"><option value="">Select Department</option></select></div>
        <div class="form-group"><label>Role</label><select id="role_id"><option value="">Select Role</option></select></div>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="status"><option value="active">Active</option><option value="inactive">Inactive</option></select>
      </div>
      <div class="form-actions">
        <button id="editBtn" class="btn-primary"><i class="fa fa-save"></i> Save Changes</button>
        <button id="cancelBtn" class="btn-secondary"><i class="fa fa-times"></i> Cancel</button>
      </div>
    </div>
  </div>
  <script src="/shared/auth.js"></script>
  <script src="/shared/sidebar.js"></script>
  <script src="/shared/layout.js"></script>
  <script src="employee-edit.js"></script>
  <script>checkLogin();</script>
</body>
</html>
