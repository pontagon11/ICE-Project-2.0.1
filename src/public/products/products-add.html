<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Product | ICE ERP</title>
  <link rel="icon" type="image/x-icon" href="/img/favicon.ico" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="/shared/base.css" />
  <link rel="stylesheet" href="/shared/navbar.css" />
  <link rel="stylesheet" href="/shared/sidebar.css" />
  <link rel="stylesheet" href="products-add.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/shared/swal.js"></script>
</head>
<body>
  <div id="navbar-placeholder"></div>
  <div id="sidebarContainer"></div>
  <div class="page-title-bar"><h1><i class="fa fa-plus-circle"></i> Add Product</h1></div>
  <div class="page-content">
    <div class="form-card">
      <div class="photo-section">
        <img id="previewImg" src="/img/products/default.png" alt="Preview" class="preview-photo" onerror="this.src='/img/favicon.ico'" />
        <button type="button" id="chooseImageBtn" class="btn-secondary"><i class="fa fa-image"></i> Choose Photo</button>
        <input type="file" id="pro_img" accept="image/*" style="display:none" />
      </div>
      <div class="form-group"><label>Product Name</label><input type="text" id="pro_name" placeholder="Product name" /></div>
      <div class="form-row">
        <div class="form-group"><label>Price (THB)</label><input type="number" id="pro_price" placeholder="0.00" step="0.01" min="0" /></div>
        <div class="form-group"><label>Quantity</label><input type="number" id="pro_qty" placeholder="0" min="0" /></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Weight (kg)</label><input type="number" id="pro_weight" placeholder="0.00" step="0.01" min="0" /></div>
        <div class="form-group"><label>Status</label><select id="pro_status"><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
      </div>
      <div class="form-actions">
        <button id="saveBtn" class="btn-primary"><i class="fa fa-save"></i> Save</button>
        <button id="cancelBtn" class="btn-secondary"><i class="fa fa-times"></i> Cancel</button>
      </div>
    </div>
  </div>
  <script src="/shared/auth.js"></script>
  <script src="/shared/sidebar.js"></script>
  <script src="/shared/layout.js"></script>
  <script src="products-add.js"></script>
  <script>checkLogin();</script>
</body>
</html>
