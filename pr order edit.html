<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>edit pr order</title>
    <link rel="stylesheet" href="pr order edit.css">
</head>

<body>

    <header>
        <nav>
            <div class="container">
                <div class="nav-wrapper">
                    <div class="menu">
                        <a href="#">Home</a>
                        <a href="#">Logout</a>
                    </div>
                    <div class="profile">
                        <img src="img/Haro.webp" class="profile-img">
                        <div>
                            <p>Profile</p>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <section class="customer-menu2">
        <div class="container2"></div>
    </section>

    <section class="bigname">
        <div class="container3">
            <div class="name">
                <h1>Edit PR Order</h1>
            </div>
        </div>
    </section>

    <section class="purchase-requisition-information">
        <div class="container4">
            <div class="wrapper2">
                <div class="name-pr">
                    <h2>ชื่อ PR Order</h2>
                    <input type="text">
                    <button class="image-button"></button>
                </div>
            </div>
        </div>
    </section>

    <section class="purchase-requisition-section">
        <div class="pr-details">
            <h2>รายละเอียดใบขอซื้อ</h2>
            <form class="form-grid">
                <div class="form-group">
                    <label for="weight-mat">วันที่ขอซื้อ</label>
                    <input type="date" id="purchaseDate" />
                </div>
                <div class="form-group">
                    <label for="Weight unit">วันที่ต้องการ</label>
                    <input type="date" id="purchaseDate" />
                </div>
            </form>
            <div class="print-box">
                <button type="submit">พิมพ์</button>
            </div>
        </div>
    </section>

    <section class="product-materials-section">
        <div class="product-materials-details">
            <h2>product and materials</h2>
            <table>
                <thead>
                    <tr>
                        <th>ชื่อวัตถุดิบ</th>
                        <th>จำนวน</th>
                        <th><button type="submit">+ROW</button></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>
                            <select id="status" name="status">
                                <option value="1">SELECT</option>
                                <option value="2">1</option>
                                <option value="3">2</option>
                            </select>
                        </td>
                        <td>
                            <input type="text">
                        </td>
                        <td><button class="delete-btn">🗑️</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

    <section class="bottom button">
        <div class="container5">
            <div class="wrapper3">
                <div class="cancel-box">
                    <button type="submit">Cancel</button>
                </div>
                <div class="edit-box">
                    <button type="submit">Edit</button>
                </div>
            </div>
        </div>
    </section>

</body>

</html>
