<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Edit BOM</title>
  <link rel="stylesheet" href="bom-add.css">
</head>

<body>

  <header>
    <nav>
      <div class="nav-wrapper">
        <div class="menu">
          <a href="home.html" id="menuHome">Home</a>
          <a href="employee.html" id="menuEmployees">Employees</a>
          <a href="manage-permissions.html" id="menuPermissions">Permissions</a>
          <a href="#" id="logoutBtn">Logout</a>
        </div>
        <div class="profile">
          <img id="profileImg" class="profile-img">
          <span id="username"></span>
        </div>
      </div>
    </nav>
  </header>

  <section class="page-title">
    <div class="title-box">
      <h1>Edit BOM</h1>
    </div>
  </section>

  <!-- BOM HEADER -->
  <section class="card">
    <h2>ข้อมูลสินค้า</h2>

    <div class="form-grid">
      <div class="form-group">
        <label>BOM No</label>
        <input id="bomNo" readonly>
      </div>

      <div class="form-group">
        <label>สินค้า</label>
        <select id="productSelect" disabled></select>
      </div>
    </div>
  </section>

  <!-- BOM DETAILS -->
  <section class="card">
    <h2>วัตถุดิบใน BOM</h2>

    <div class="form-grid">
      <div class="form-group">
        <label>วัตถุดิบ</label>
        <select id="materialSelect"></select>
      </div>

      <div class="form-group">
        <label>Usage Qty</label>
        <input id="usageQty" type="number" step="0.01">
      </div>
    </div>

    <div class="add-material-row">
      <button id="addMaterialBtn" class="btn-primary">+ Add Material</button>
    </div>

    <table class="material-table">
      <thead>
        <tr>
          <th>Material No</th>
          <th>Material Name</th>
          <th>Usage Qty</th>
          <th>Delete</th>
        </tr>
      </thead>
      <tbody id="materialTableBody"></tbody>
    </table>
  </section>

  <div class="bottom-buttons">
    <button class="btn-cancel" onclick="window.location.href='bom.html'">
      Cancel
    </button>
    <button id="saveBomBtn" class="btn-save">
      UPDATE BOM
    </button>
  </div>
  <script src="auth.js"></script>
  <script src="sidebar.js"></script>
  <script src="layout.js"></script>
  <script src="bom-edit.js"></script>
  <script>
    checkLogin();
  </script>
</body>

</html>
