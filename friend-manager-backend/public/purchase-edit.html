<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>edit purchase order</title>
    <link rel="stylesheet" href="purchase order edit.css">
</head>

<body>

    <header>
        <nav>
            <div class="nav-wrapper">
                <div class="menu">
                    <a href="home.html" id="menuHome">Home</a>
                    <a href="employee.html" id="menuEmployees">Employees</a>
                    <a href="manage-permissions.html" id="menuPermissions">Permissions</a>
                    <a href="#" id="logoutBtn">Logout</a>
                </div>
                <div class="profile">
                    <img id="profileImg" class="profile-img">
                    <span id="username"></span>
                </div>
            </div>
        </nav>
    </header>

    <section class="customer-menu2">
        <div class="container2"></div>
    </section>

    <section class="bigname">
        <div class="container3">
            <div class="name">
                <h1>Edit Purchase Order</h1>
            </div>
        </div>
    </section>

    <section class="purchase-order-information">
        <div class="container4">
            <div class="wrapper2">
                <div class="name-purchase-order">
                    <h2>ชื่อ Purchase Order</h2>
                    <input type="text">
                </div>
                <div class="purchase-order-details">
                    <h2>ข้อมูลใบสั่งซื้อและ Forecast</h2>
                    <form class="form-grid">
                        <div class="form-group">
                            <label for="orderDate">วันสั่งซื้อ</label>
                            <input type="text" />
                        </div>
                        <div class="form-group">
                            <label for="dueDate">วันกำหนดส่ง</label>
                            <input type="text" />
                        </div>
                        <div class="form-group">
                            <label for="status">สถานะใบสั่งซื้อ</label>
                            <select id="status" name="status">
                                <option value="1">SELECT</option>
                                <option value="2">1</option>
                                <option value="3">2</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="customer">ลูกค้า</label>
                            <select id="customer" name="customer">
                                <option value="1">SELECT</option>
                                <option value="2">1</option>
                                <option value="3">2</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="type">ประเภท</label>
                            <select id="type" name="type">
                                <option value="1">SELECT</option>
                                <option value="2">1</option>
                                <option value="3">2</option>
                            </select>
                        </div>
                        <div class="form-group button-group">
                            <button type="button">
                                🔄
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <section class="bottom button">
        <div class="container5">
            <div class="wrapper3">
                <div class="cancel-box">
                    <button type="submit">Cancel</button>
                </div>
                <div class="add-box">
                    <button type="submit">ADD</button>
                </div>
            </div>
        </div>
    </section>
    <script src="auth.js"></script>
    <script src="sidebar.js"></script>
    <script src="layout.js"></script>
    <script src="purchase-edit.js"></script>
    <script>
        checkLogin();
    </script>
</body>

</html>
