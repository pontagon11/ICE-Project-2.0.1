<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link rel="stylesheet" href="home.css" />
</head>

<body>
    <div id="navbar-placeholder"></div>

    <section class="home-menu2">
        <div id="sidebarContainer">
            <ul id="sidebarMenu"></ul>
        </div>
    </section>

    <section class="bigname">
        <div class="name">
            <h1>Dashboard</h1>
        </div>
    </section>

    <!-- ===== SUMMARY CARDS ===== -->
    <section class="home-menu3">
        <div class="card-container">
            <div class="card">
                <h3>Total Products</h3>
                <p id="totalProducts">0</p>
            </div>

            <div class="card">
                <h3>Total Materials</h3>
                <p id="totalMaterials">0</p>
            </div>

            <div class="card">
                <h3>Total IN</h3>
                <p id="totalIn">0</p>
            </div>

            <div class="card">
                <h3>Total OUT</h3>
                <p id="totalOut">0</p>
            </div>
        </div>

        <!-- ===== LOW STOCK TABLE ===== -->
        <h2>⚠️ Low Stock Items</h2>
        <table>
            <thead>
                <tr>
                    <th>Item Name</th>
                    <th>Balance</th>
                </tr>
            </thead>
            <tbody id="lowStockTable"></tbody>
        </table>

        <!-- ===== CHART ===== -->
        <h2>📈 Monthly IN / OUT</h2>
        <div class="chart-container" style="position: relative; height:300px; width:100%;">
            <canvas id="stockChart"></canvas>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="auth.js"></script>
    <script src="sidebar.js"></script>
    <script src="layout.js"></script>
    <script src="home.js"></script>
    <script>
        checkLogin();
    </script>
</body>

</html>
