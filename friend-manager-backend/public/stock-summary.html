<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Summary</title>
    <link rel="stylesheet" href="stock-summary.css">
</head>

<body>

    <!-- ===== TOP NAV ===== -->
    <header>
        <nav>
            <div class="nav-wrapper">
                <div class="menu">
                    <a href="home.html" id="menuHome">Home</a>
                    <a href="employee.html" id="menuEmployees">Employees</a>
                    <a href="manage-permissions.html" id="menuPermissions">Permissions</a>
                    <a href="#" id="logoutBtn">Logout</a>
                </div>
                <div class="profile">
                    <img id="profileImg" class="profile-img">
                    <span id="username"></span>
                </div>
            </div>
        </nav>
    </header>

    <!-- ===== SIDEBAR ===== -->
    <section class="home-menu2">
        <div id="sidebarContainer">
            <ul id="sidebarMenu"></ul>
        </div>
    </section>

    <!-- ===== TITLE ===== -->
    <section class="bigname">
        <div class="container3">
            <div class="name">
                <h1>Stock Summary</h1>
            </div>
        </div>
    </section>

    <!-- ===== FILTER + SEARCH ===== -->
    <section class="stock-controls">
        <div class="controls-wrapper">
            <select id="typeFilter">
                <option value="all">All</option>
                <option value="product">Product</option>
                <option value="materials">Material</option>
            </select>

            <input type="text" id="searchInput" placeholder="Search item name...">

            <button id="searchBtn">Search</button>
        </div>
    </section>

    <!-- ===== STOCK TABLE ===== -->
    <section class="stock-table-section">
        <div class="container5">
            <table>
                <thead>
                    <tr>
                        <th>Type</th>
                        <th>Item Name</th>
                        <th>Total IN</th>
                        <th>Total OUT</th>
                        <th>Balance</th>
                    </tr>
                </thead>
                <tbody id="stockTable"></tbody>
            </table>
        </div>
    </section>
    <script src="auth.js"></script>
    <script src="sidebar.js"></script>
    <script src="layout.js"></script>
    <script src="stock-summary.js"></script>
    <script>
        checkLogin();
    </script>

</body>

</html>
