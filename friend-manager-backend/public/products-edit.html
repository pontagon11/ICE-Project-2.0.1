<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Product</title>
  <link rel="stylesheet" href="products-add.css">
</head>

<body>

  <header>
    <nav>
      <div class="nav-wrapper">
        <div class="menu">
          <a href="home.html" id="menuHome">Home</a>
          <a href="employee.html" id="menuEmployees">Employees</a>
          <a href="manage-permissions.html" id="menuPermissions">Permissions</a>
          <a href="#" id="logoutBtn">Logout</a>
        </div>
        <div class="profile">
          <img id="profileImg" class="profile-img">
          <span id="username"></span>
        </div>
      </div>
    </nav>
  </header>

  <section class="bigname">
    <div class="name">
      <h1>Edit Product</h1>
    </div>
  </section>

  <!-- ===== FORM START ===== -->
  <form id="productForm" onsubmit="return false;">

    <!-- ===== PRODUCT NAME ===== -->
    <section>
      <div class="name-product">
        <h2>ชื่อสินค้า</h2>

        <input id="pro_name" type="text" placeholder="ชื่อสินค้า" required>
        <input id="pro_img" name="pro_img" type="file" accept="image/*" hidden>
        <button type="button" class="image-button" id="chooseImageBtn">
          📷 IMAGE
        </button>
      </div>

      <!-- preview รูป -->
      <div class="image-preview">
        <img id="previewImg" alt="preview">
      </div>
    </section>

    <!-- ===== PRODUCT DETAIL ===== -->
    <section class="product-section">
      <div class="product-details">
        <h2>ข้อมูลสินค้า</h2>

        <div class="form-grid">

          <div class="form-group">
            <label>จำนวนสินค้า</label>
            <input type="number" id="pro_qty" name="pro_qty" min="0" required>
          </div>

          <div class="form-group">
            <label>ราคา</label>
            <input id="pro_price" type="number" step="0.01">
            <label>(บาท)</label>
          </div>

          <div class="form-group">
            <label>น้ำหนัก</label>
            <input id="pro_weight" type="number" step="0.01">
            <label>(kg)</label>
          </div>

          <div class="form-group">
            <label>สถานะสินค้า</label>
            <select id="pro_status" required>
              <option value="">SELECT</option>
              <option value="1">In Stock</option>
              <option value="2">Low Stock</option>
              <option value="3">Out of Stock</option>
              <option value="4">Reserved</option>
              <option value="5">Inactive</option>
            </select>
          </div>

        </div>
      </div>
    </section>

  </form>
  <!-- ===== FORM END ===== -->

  <!-- ===== BOTTOM BUTTON ===== -->
  <section>
    <div class="container5">
      <div class="wrapper3">

        <div class="cancel-box">
          <button id="cancelBtn" type="button">Cancel</button>
        </div>

        <div class="add-box">
          <button id="saveBtn" type="button">SAVE</button>
        </div>

      </div>
    </div>
  </section>
  <script src="auth.js"></script>
  <script src="sidebar.js"></script>
  <script src="layout.js"></script>
  <script src="products-edit.js"></script>
  checkLogin();
  </script>
</body>

</html>
