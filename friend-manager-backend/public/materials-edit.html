<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Materials</title>
  <link rel="stylesheet" href="materials-edit.css">
</head>

<body>

  <header>
    <nav>
      <div class="nav-wrapper">
        <div class="menu">
          <a href="home.html" id="menuHome">Home</a>
          <a href="employee.html" id="menuEmployees">Employees</a>
          <a href="manage-permissions.html" id="menuPermissions">Permissions</a>
          <a href="#" id="logoutBtn">Logout</a>
        </div>
        <div class="profile">
          <img id="profileImg" class="profile-img">
          <span id="username"></span>
        </div>
      </div>
    </nav>
  </header>

  <!-- ===== TITLE ===== -->
  <section class="bigname">
    <div class="name">
      <h1>Edit Materials</h1>
    </div>
  </section>

  <!-- ===== FORM START ===== -->
  <form id="editMaterialForm" onsubmit="return false;">

    <!-- ===== MATERIAL NAME ===== -->
    <section>
      <div class="name-material">
        <h2>ชื่อ Materials</h2>
        <input id="edit_mat_name" type="text" required>
        <input id="edit_mat_img" name="mat_img" type="file" accept="image/*" hidden>
        <button type="button" class="image-button" id="chooseEditImageBtn"> 📷 IMAGE </button>
      </div>

      <!-- preview รูป -->
      <div class="image-preview">
        <img id="edit_previewImg" alt="preview">
      </div>
    </section>

    <!-- ===== MATERIAL DETAIL ===== -->
    <section class="material-section">
      <div class="material-details">
        <h2>ข้อมูลวัตถุดิบ</h2>

        <div class="form-grid">

          <div class="form-group">
            <label>น้ำหนัก</label>
            <input id="edit_mat_weight" type="number" step="0.01">
            <label>(kg)</label>
          </div>

          <div class="form-group">
            <label>ราคา</label>
            <input id="edit_mat_price" type="number" step="0.01" required>
          </div>

          <div class="form-group">
            <label>ขนาด</label>
            <input id="edit_mat_size" type="text">
            <label>(mm)</label>
          </div>

          <div class="form-group">
            <label>จำนวนวัตถุดิบ</label>
            <input id="edit_mat_qty" type="number">
          </div>

          <div class="form-group">
            <label>สถานะวัตถุดิบ</label>
            <select id="edit_mat_status" required>
              <option value="1">In Stock</option>
              <option value="2">Low Stock</option>
              <option value="3">Out of Stock</option>
              <option value="4">Reserved</option>
              <option value="5">Inactive</option>
            </select>
          </div>

        </div>
      </div>
    </section>

  </form>
  <!-- ===== FORM END ===== -->

  <!-- ===== BOTTOM BUTTON ===== -->
  <section>
    <div class="container5">
      <div class="wrapper3">
        <div class="cancel-box">
          <button id="editCancelBtn" type="button">Cancel</button>
        </div>
        <div class="edit-box">
          <button id="editSaveBtn" type="button">Edit</button>
        </div>
      </div>
    </div>
  </section>
  <script src="auth.js"></script>
  <script src="sidebar.js"></script>
  <script src="layout.js"></script>
  <script src="materials-edit.js"></script>
  <script>
    checkLogin();
  </script>
</body>

</html>
