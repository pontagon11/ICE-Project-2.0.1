<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management</title>
    <link rel="stylesheet" href="employee.css">
</head>

<body>

    <header>
        <nav>
            <div class="nav-wrapper">
                <div class="menu">
                    <a href="home.html" id="menuHome">Home</a>
                    <a href="employee.html" id="menuEmployees">Employees</a>
                    <a href="manage-permissions.html" id="menuPermissions">Permissions</a>
                    <a href="#" id="logoutBtn">Logout</a>
                </div>
                <div class="profile">
                    <img id="profileImg" class="profile-img">
                    <span id="username"></span>
                </div>
            </div>
        </nav>
    </header>

    <section class="home-menu2">
        <div id="sidebarContainer">Loading...</div>
    </section>

    <section class="bigname">
        <div class="container3">
            <div class="name">
                <h1>Employee Management</h1>
            </div>
        </div>
    </section>

    <section class="controls">
        <div class="container4">
            <div class="add-box">
                <button type="button" id="addEmployeeBtn" class="btn-primary">ADD</button>
            </div>

            <div class="search-box">
                <input type="text" id="searchInput" class="search-bar" placeholder="Search...">

                <select id="statusFilter">
                    <option value="">All Status</option>
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                </select>

                <select id="roleFilter">
                    <option value="">All Roles</option>
                </select>

                <select id="deptFilter">
                    <option value="">All Departments</option>
                </select>

                <button id="searchBtn" type="button" class="btn-primary">Search</button>
            </div>
        </div>
    </section>

    <section class="table-section">

        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>Photo</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Tel</th>
                    <th>Department</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Edit</th>
                    <th>Delete</th>
                </tr>
            </thead>

            <tbody id="employeeTable"></tbody>

        </table>

    </section>
    <script src="auth.js"></script>
    <script src="sidebar.js"></script>
    <script src="layout.js"></script>
    <script src="employee.js"></script>
    <script>
        checkLogin();
    </script>

</body>

</html>
