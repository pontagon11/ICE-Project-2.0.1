<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>add employee</title>
    <link rel="stylesheet" href="employee-add.css">
</head>

<body>

    <header>
        <nav>
            <div class="nav-wrapper">
                <div class="menu">
                    <a href="home.html" id="menuHome">Home</a>
                    <a href="employee.html" id="menuEmployees">Employees</a>
                    <a href="manage-permissions.html" id="menuPermissions">Permissions</a>
                    <a href="#" id="logoutBtn">Logout</a>
                </div>
                <div class="profile">
                    <img id="profileImg" class="profile-img">
                    <span id="username"></span>
                </div>
            </div>
        </nav>
    </header>

    <section class="customer-menu2">
        <div class="container2"></div>
    </section>

    <section class="bigname">
        <div class="container3">
            <div class="name">
                <h1>Add Employee</h1>
            </div>
        </div>
    </section>

    <section class="profile-information">
        <form id="employeeForm">
            <div class="profile-card">

                <!-- preview รูป -->
                <div class="image-preview">
                    <img id="previewImg" alt="preview"> <!--style="display:none;" -->
                </div>

                <div class="avatar">
                    <input id="emp_img" name="emp_img" type="file" accept="image/*" hidden>
                    <button type="button" class="image-button" id="chooseImageBtn">
                        📷 <br /> avatar </button>
                </div>

                <div class="form-grid">
                    <div>
                        <label>ชื่อ</label>
                        <input type="text" id="emp_fname" name="emp_fname" required>
                    </div>
                    <div>
                        <label>นามสกุล</label>
                        <input type="text" id="emp_lname" name="emp_lname" required>
                    </div>
                    <div>
                        <label>บทบาท</label>
                        <select id="emp_role" name="role_id" required>
                            <option value="">เลือก Role</option>
                        </select>
                    </div>
                    <div>
                        <label>แผนก</label>
                        <select id="emp_department" name="dept_id" required>
                            <option value="">เลือกแผนก</option>
                        </select>
                    </div>
                    <div>
                        <label>Username</label>
                        <input type="text" id="emp_username" name="emp_username" required>
                    </div>
                    <div class="password-field">
                        <label>Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="emp_password" name="emp_password" required>
                            <span id="toggle-password">👁️</span>
                        </div>
                    </div>
                    <div>
                        <label>EMAIL</label>
                        <input type="email" id="emp_email" name="emp_email" required>
                    </div>
                    <div>
                        <label>Phone</label>
                        <input type="tel" id="emp_tel" name="emp_tel">
                    </div>
                </div>
            </div>
        </form>
    </section>

    <section class="bottom button">
        <div class="container5">
            <div class="wrapper3">
                <div class="cancel-box">
                    <button id="cancelBtn" type="button">Cancel</button>
                </div>

                <div class="add-box">
                    <button id="saveBtn" type="submit">ADD</button>
                </div>
            </div>
        </div>
    </section>
    <script src="auth.js"></script>
    <script src="sidebar.js"></script>
    <script src="layout.js"></script>
    <script src="employee-add.js"></script>
    <script>
        checkLogin();
    </script>
</body>

</html>
