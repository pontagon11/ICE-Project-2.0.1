<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Transaction</title>
    <link rel="stylesheet" href="transactions-add.css">
</head>

<body>

    <!-- ===== HEADER ===== -->
    <header>
        <nav>
            <div class="nav-wrapper">
                <div class="menu">
                    <a href="home.html" id="menuHome">Home</a>
                    <a href="employee.html" id="menuEmployees">Employees</a>
                    <a href="manage-permissions.html" id="menuPermissions">Permissions</a>
                    <a href="#" id="logoutBtn">Logout</a>
                </div>
                <div class="profile">
                    <img id="profileImg" class="profile-img">
                    <span id="username"></span>
                </div>
            </div>
        </nav>
    </header>

    <!-- ===== PAGE TITLE ===== -->
    <section class="bigname">
        <div class="name">
            <h1>Edit Transaction</h1>
        </div>
    </section>

    <!-- ===== FORM START ===== -->
    <form id="transactionForm" onsubmit="return false;">

        <!-- ===== TRANSACTION TYPE ===== -->
        <section>
            <div class="name-product">
                <h2>ประเภทรายการ</h2>

                <select id="tra_type" required>
                    <option value="">SELECT</option>
                    <option value="IN">IN</option>
                    <option value="OUT">OUT</option>
                </select>
            </div>
        </section>

        <!-- ===== ITEM TYPE ===== -->
        <div class="form-group">
            <label>Item Type</label>
            <select id="tra_item_type" required>
                <option value="">SELECT</option>
                <option value="product">Products</option>
                <option value="material">Materials</option>
            </select>
        </div>

        <!-- ===== TRANSACTION DETAIL ===== -->
        <section class="product-section">
            <div class="product-details">
                <h2>ข้อมูลรายการ</h2>

                <div class="form-grid">

                    <div class="form-group">
                        <label>สินค้า</label>
                        <select id="tra_item_id" required>
                            <option value="">SELECT ITEM</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>จำนวน</label>
                        <input type="number" id="tra_qty" min="1" required>
                    </div>

                    <div class="form-group">
                        <label>หมายเหตุ</label>
                        <input type="text" id="tra_note">
                    </div>

                </div>
            </div>
        </section>

    </form>
    <!-- ===== FORM END ===== -->

    <!-- ===== BUTTONS ===== -->
    <section>
        <div class="container5">
            <div class="wrapper3">

                <div class="cancel-box">
                    <button id="cancelBtn" type="button">Cancel</button>
                </div>

                <div class="add-box">
                    <button id="saveBtn" type="button">Update</button>
                </div>

            </div>
        </div>
    </section>
    <!-- ===== SCRIPT ===== -->
    <script src="auth.js"></script>
    <script src="sidebar.js"></script>
    <script src="layout.js"></script>
    <script src="transactions-edit.js"></script>
    <script>
        checkLogin();
    </script>

</body>

</html>
