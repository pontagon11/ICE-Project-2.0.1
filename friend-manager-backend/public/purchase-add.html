<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Add Purchase</title>
    <link rel="stylesheet" href="purchase-add.css">
</head>

<body>

    <header>
        <nav>
            <div class="nav-wrapper">
                <div class="menu">
                    <a href="home.html" id="menuHome">Home</a>
                    <a href="employee.html" id="menuEmployees">Employees</a>
                    <a href="manage-permissions.html" id="menuPermissions">Permissions</a>
                    <a href="#" id="logoutBtn">Logout</a>
                </div>
                <div class="profile">
                    <img id="profileImg" class="profile-img" src="/img/Haro.webp" alt="Profile">
                    <span id="username"></span>
                </div>
            </div>
        </nav>
    </header>

    <!-- ===== TITLE ===== -->
    <section class="page-title">
        <div class="title-box">
            <h1>Add Purchase</h1>
        </div>
    </section>

    <!-- ===== HEADER ===== -->
    <section class="card">
        <div class="form-grid">
            <div class="form-group">
                <label>PO No</label>
                <input id="poNo" type="text" readonly>
            </div>
        </div>
    </section>

    <!-- ===== DETAIL ===== -->
    <section class="card">
        <h2>Add Material</h2>

        <div class="form-grid">
            <div class="form-group">
                <label>Material</label>
                <select id="materialSelect">
                    <option value="">SELECT MATERIAL</option>
                </select>
            </div>

            <div class="form-group">
                <label>Stock</label>
                <div id="currentStockDisplay" style="font-weight: bold; font-size: 1.2rem; padding-top: 10px;">0</div>
            </div>

            <div class="form-group">
                <label>Qty</label>
                <input id="qtyInput" type="number" placeholder="Qty">
            </div>
        </div>

        <div class="add-material-row">
            <button id="addItemBtn" type="button">+ Add Item</button>
        </div>

        <table class="material-table">
            <thead>
                <tr>
                    <th>Material</th>
                    <th style="text-align: center;">Qty</th>
                    <th style="text-align: center;">Delete</th>
                </tr>
            </thead>
            <tbody id="itemTable">
                <tr>
                    <td colspan="3" class="text-center">ยังไม่มีรายการ</td>
                </tr>
            </tbody>
        </table>
    </section>

    <section class="card">
        <div class="form-group">
            <label>หมายเหตุ (Note)</label>
            <textarea id="note" rows="2" placeholder="ระบุรายละเอียดเพิ่มเติม..."></textarea>
        </div>
    </section>

    <!-- ===== BUTTON ===== -->
    <div class="bottom-buttons">
        <button id="cancelBtn" type="button">Cancel</button>
        <button id="saveBtn" type="button">SAVE</button>
    </div>
    <script src="auth.js"></script>
    <script src="sidebar.js"></script>
    <script src="layout.js"></script>
    <script src="purchase-add.js"></script>
</body>

</html>
