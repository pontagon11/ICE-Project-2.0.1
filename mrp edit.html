<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>edit mrp</title>
    <link rel="stylesheet" href="mrp edit.css">
</head>

<body>

    <header>
        <nav>
            <div class="container">
                <div class="nav-wrapper">
                    <div class="menu">
                        <a href="#">Home</a>
                        <a href="#">Logout</a>
                    </div>
                    <div class="profile">
                        <img src="img/Haro.webp" class="profile-img">
                        <div>
                            <p>Profile</p>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <section class="customer-menu2">
        <div class="container2"></div>
    </section>

    <section class="bigname">
        <div class="container3">
            <div class="name">
                <h1>Edit MRP</h1>
            </div>
        </div>
    </section>

    <section class="mrp-information">
        <div class="container4">
            <div class="wrapper2">
                <div class="name-mps">
                    <h2>ชื่อ MRP</h2>
                    <input type="text">
                </div>
                <div class="mrp-calculation">
                    <h2>คำนวณ MRP</h2>
                    <form class="form-grid">
                        <div class="form-group">
                            <label for="orderNo">เลขที่คำสั่งซื้อ</label>
                            <input type="text" id="orderNo" />
                        </div>
                        <div class="form-group">
                            <label for="mps">MPS</label>
                            <input type="text" id="mps" />
                        </div>
                        <div class="form-group">
                            <label for="dueDate">วันที่หมดส่ง</label>
                            <input type="text" id="dueDate" />
                        </div>
                        <div class="form-group">
                            <label for="starMps">STAR MPS</label>
                            <input type="text" id="starMps" />
                        </div>
                        <div class="form-group">
                            <label for="partNo">หมายเลขชิ้นงาน</label>
                            <input type="text" id="partNo" />
                        </div>
                    </form>

                    <table>
                        <thead>
                            <tr>
                                <th>ชื่อวัตถุดิบ</th>
                                <th>น้ำหนักวัตถุดิบ</th>
                                <th>อัตราการใช้</th>
                                <th>วัตถุดิบคงคลัง</th>
                                <th>จำนวนวัตถุดิบที่ต้องการสั่งซื้อ</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>RIOI84701</td>
                                <td>1.18</td>
                                <td>2</td>
                                <td>40</td>
                                <td>5,000</td>
                            </tr>
                            <tr>
                                <td>TEST</td>
                                <td>1.16</td>
                                <td>3</td>
                                <td>10</td>
                                <td>7,500</td>
                            </tr>
                        </tbody>
                    </table>
                    <div class="form-group-button-group">
                        <button type="button">
                            🔄
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="bottom button">
        <div class="container5">
            <div class="wrapper3">
                <div class="cancel-box">
                    <button type="submit">Cancel</button>
                </div>
                <div class="add-box">
                    <button type="submit">ADD</button>
                </div>
            </div>
        </div>
    </section>

</body>

</html>
