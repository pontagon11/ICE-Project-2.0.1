<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>add mps</title>
    <link rel="stylesheet" href="mps add.css">
</head>

<body>

    <header>
        <nav>
            <div class="container">
                <div class="nav-wrapper">
                    <div class="menu">
                        <a href="#">Home</a>
                        <a href="#">Logout</a>
                    </div>
                    <div class="profile">
                        <img src="img/Haro.webp" class="profile-img">
                        <div>
                            <p>Profile</p>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <section class="customer-menu2">
        <div class="container2"></div>
    </section>

    <section class="bigname">
        <div class="container3">
            <div class="name">
                <h1>Add MPS</h1>
            </div>
        </div>
    </section>

    <section class="mps-information">
        <div class="container4">
            <div class="wrapper2">
                <div class="name-mps">
                    <h2>ชื่อ MPS</h2>
                    <input type="text">
                </div>
                <div class="mps-calculation">
                    <h2>คำนวณ MPS</h2>
                    <form class="form-grid">
                        <div class="form-group">
                            <label for="Order number">เลขที่คำสั่งซื้อ</label>
                            <select id="status" name="status">
                                <option value="1">SELECT</option>
                                <option value="2">1</option>
                                <option value="3">2</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="Order number">ประเภท</label>
                            <select id="status" name="status">
                                <option value="1">SELECT</option>
                                <option value="2">1</option>
                                <option value="3">2</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="dueDate">หมายเลขชิ้นงาน</label>
                            <input type="text" />
                        </div>
                        <div class="form-group">
                            <label for="Total demand">ความต้องการรวม</label>
                            <input type="text" />
                        </div>
                        <div class="form-group">
                            <label for="Beginning balance">ชิ้นงานคงเหลือต้นงวด</label>
                            <input type="text" />
                        </div>
                        <div class="form-group">
                            <label for="Deadline">วันกำหนดส่ง</label>
                            <input type="text" />
                        </div>
                        <h2>กรอก Lot Size</h2>
                        <div class="0">
                            <label for="0"></label>
                        </div>
                        <div class="form-group">
                            <label for="lot-size">Lot Size</label>
                            <input type="text" />
                        </div>
                        <div class="form-group">
                            <label for="MPS-results">ผลลัพธ์ MPS</label>
                            <input type="text" />
                        </div>
                        <div class="form-group button-group">
                            <button type="button">
                                🔄
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <section class="bottom button">
        <div class="container5">
            <div class="wrapper3">
                <div class="cancel-box">
                    <button type="submit">Cancel</button>
                </div>
                <div class="add-box">
                    <button type="submit">ADD</button>
                </div>
            </div>
        </div>
    </section>

</body>

</html>
