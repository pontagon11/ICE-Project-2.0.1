<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>receiving withdrawing</title>
    <link rel="stylesheet" href="receiving withdrawing.css">
</head>

<body>

    <header>
        <nav>
            <div class="container">
                <div class="nav-wrapper">
                    <div class="menu">
                        <a href="home.html">Home</a>
                        <a href="login.html">Logout</a>
                    </div>
                    <div class="profile">
                        <img src="img/Haro.webp" class="profile-img">
                        <div>
                            <p>Profile</p>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <section class="customer-menu2">
        <div class="container2"></div>
    </section>

    <section class="bigname">
        <div class="container3">
            <div class="name">
                <h1>Receiving Withdrawing</h1>
            </div>
        </div>
    </section>

    <section class="receiving-withdrawing-section">
            <div class="receiving-withdrawing-details">
                <h3>ประวัติการรับและเบิกชิ้นงาน</h3>
                <div class="form-grid">
                    <div>
                        <label>วันที่</label>
                        <input type="date" id="input-date">
                    </div>
                    <div>
                        <label>จำนวนชิ้นงานรับเข้า</label>
                        <input type="number" id="input-receive">
                    </div>
                    <div>
                        <label>หมายเหตุการรับเพิ่ม</label>
                        <select id="input-receive-note">
                            <option>SELECT</option>
                            <option>เพิ่มตามคำสั่งซื้อ</option>
                            <option>ผลิตเกิน</option>
                        </select>
                    </div>
                    <div>
                        <label>เลขที่คำสั่งซื้อ</label>
                        <select id="input-order-number">
                            <option>SELECT</option>
                            <option>PO12345</option>
                            <option>PO67890</option>
                        </select>
                    </div>
                    <div>
                        <label>จำนวนที่ต้องส่งชิ้นงาน</label>
                        <input type="number" id="input-send">
                    </div>
                    <div>
                        <label>จำนวนชิ้นงานเบิกออก</label>
                        <input type="number" id="input-issue">
                    </div>
                    <div class="full-width">
                        <label>หมายเหตุการจ่ายออก</label>
                        <select id="input-issue-note">
                            <option>SELECT</option>
                            <option>ส่งลูกค้า</option>
                            <option>เบิกภายใน</option>
                        </select>
                    </div>
                    <div class="full-width">
                        <button class="add-button" id="add-btn">ADD</button>
                    </div>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>วันที่</th>
                            <th>จำนวนรับเข้า</th>
                            <th>หมายเหตุรับเพิ่ม</th>
                            <th>เลขที่คำสั่งซื้อ</th>
                            <th>จำนวนเบิกออก</th>
                            <th>หมายเหตุจ่ายออก</th>
                            <th>EDIT</th>
                            <th>DELETE</th>
                        </tr>
                    </thead>
                    <tbody id="data-body">
                        <!-- ข้อมูลจะถูกเพิ่มที่นี่ -->
                    </tbody>
                </table>

                <div class="stock-section">
                    <h3>ALL PARTS STOCK</h3>
                    <div class="stock-grid">
                        <div>
                            <label>STOCK FG</label>
                            <input type="text">
                        </div>
                        <div>
                            <label>WIP (FG)</label>
                            <input type="text">
                        </div>
                        <div>
                            <label>WIP (PPD)</label>
                            <input type="text">
                        </div>
                        <div>
                            <label>NG</label>
                            <input type="text">
                        </div>
                    </div>
                </div>
            </div>

        <script src="receiving withdrawing.js"></script>
    </section>

    <section class="bottom button">
        <div class="container5">
            <div class="wrapper3">
                <div class="cancel-box">
                    <button type="submit">Cancel</button>
                </div>
                <div class="add-box">
                    <button type="submit">ADD</button>
                </div>
            </div>
        </div>
    </section>

</body>

</html>
