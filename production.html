<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>production</title>
    <link rel="stylesheet" href="production.css">
</head>

<body>

    <header>
        <nav>
            <div class="container">
                <div class="nav-wrapper">
                    <div class="menu">
                        <a href="home.html">Home</a>
                        <a href="login.html">Logout</a>
                    </div>
                    <div class="profile">
                        <img src="img/Haro.webp" class="profile-img">
                        <div>
                            <p>Profile</p>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <section class="customer-menu2">
        <div class="container2"></div>
    </section>

    <section class="bigname">
        <div class="container3">
            <div class="name">
                <h1>Production</h1>
            </div>
        </div>
    </section>

    <section class="production-information">
        <div class="container4">
            <div class="production-details">
                <h2>รายละเอียดการผลิต</h2>
                <form class="form-grid">
                    <div class="form-group">
                        <label for="department/agency">แผนก/หน่วยงาน</label>
                        <input type="text" />
                    </div>
                    <div class="form-group">
                        <label for="work-process">ขั้นตอนการทำงาน</label>
                        <select id="work-process" name="work-process">
                            <option value="1">SELECT</option>
                            <option value="2">1</option>
                            <option value="3">2</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="Production-standards(hours)">มาตราฐานการผลิต(ชั่วโมง)</label>
                        <input type="text" />
                    </div>
                    <div class="form-group">
                        <label for="Production-standards(day)">มาตราฐานการผลิต(วัน)</label>
                        <input type="text" />
                    </div>
                    <div class="form-group">
                        <label for="Production-time(days)">ระยะเวลาในการผลิต(วัน)</label>
                        <input type="text" />
                    </div>
                </form>

                <h2>คำนวนสต็อก</h2>
                <form class="form-grid">
                    <div class="form-group">
                        <label for="stock-status">สถานะสต็อก</label>
                        <input type="text" />
                    </div>
                    <div class="form-group">
                        <label for="remaining-work">ยกยอดงานคงเหลือ</label>
                        <input type="text" />
                    </div>
                    <div class="form-group">
                        <label for="QTY-MAT'L">QTY MAT'L ที่ต้องการ</label>
                        <input type="text" />
                    </div>
                    <div class="form-group button-group">
                        <button type="button">
                            🔄
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <section class="bottom button">
        <div class="container5">
            <div class="wrapper3">
                <div class="cancel-box">
                    <button type="submit">Cancel</button>
                </div>
                <div class="add-box">
                    <button type="submit">ADD</button>
                </div>
            </div>
        </div>
    </section>

</body>

</html>
